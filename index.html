<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Milando AI</title>
<style>
body{font-family:Arial;background:#0b1020;color:white;text-align:center;padding:30px}
h1{color:#42a5ff;font-size:40px}
.card{background:#151f3d;padding:25px;margin:20px auto;border-radius:15px;max-width:500px}
button{background:#1683ff;color:white;border:0;padding:14px 25px;border-radius:10px;font-size:16px}
input,textarea{width:90%;padding:14px;margin:10px;border-radius:8px}
textarea{height:150px}
#resultado{margin:20px;padding:20px;background:#151f3d;border-radius:10px}
</style>
</head>
<body>

<h1>Milando AI</h1>
<p>Cria filmes, séries e desenhos animados com IA.</p>

<div class="card">
<h2>🎬 Criar Filme</h2>
<button onclick="criar('Filme')">Começar</button>
</div>

<div class="card">
<h2>📺 Criar Série</h2>
<button onclick="criar('Série')">Começar</button>
</div>

<div class="card">
<h2>🦸 Criar Desenho</h2>
<button onclick="criar('Desenho')">Começar</button>
</div>

<div id="resultado"></div>

<script>
function criar(tipo){
document.getElementById("resultado").innerHTML=
"<h2>Milando AI - "+tipo+"</h2>"+
"<input id='nome' placeholder='Nome do projeto'>"+
"<textarea id='ideia' placeholder='Escreve a tua ideia'></textarea>"+
"<br><button onclick='gerar()'>Gerar projeto</button>";
}

function gerar(){
let nome=document.getElementById("nome").value;
let ideia=document.getElementById("ideia").value;
document.getElementById("resultado").innerHTML=
"<h2>"+nome+"</h2><p>"+ideia+"</p>"+
"<p>Projeto criado pelo Milando AI.</p>";
}
</script>

</body>
</html>
