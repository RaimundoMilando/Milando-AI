<script>

let selectedType = "";

const options = document.querySelectorAll(".option");

options.forEach(function(option) {

  option.addEventListener("click", function() {

    options.forEach(function(item) {
      item.classList.remove("active");
    });

    option.classList.add("active");

    selectedType = option.dataset.type;

  });

});


const processButton =
  document.getElementById("processButton");


processButton.addEventListener("click", async function() {

  const projectName =
    document.getElementById("projectName").value.trim();

  const videoText =
    document.getElementById("videoText").value.trim();

  const video =
    document.getElementById("video").files[0];

  const status =
    document.getElementById("status");

  const result =
    document.getElementById("result");

  const resultVideo =
    document.getElementById("resultVideo");

  const downloadButton =
    document.getElementById("downloadButton");


  if (!selectedType) {
    status.textContent =
      "⚠️ Escolhe o tipo de projeto.";
    return;
  }

  if (!projectName) {
    status.textContent =
      "⚠️ Escreve o nome do projeto.";
    return;
  }

  if (!video) {
    status.textContent =
      "⚠️ Escolhe um vídeo.";
    return;
  }


  processButton.disabled = true;

  status.textContent =
    "⏳ A enviar o vídeo...";


  const formData = new FormData();

  formData.append("type", selectedType);
  formData.append("projectName", projectName);
  formData.append("videoText", videoText);
  formData.append("video", video);


  try {

    const response = await fetch(
      "/api/process-video",
      {
        method: "POST",
        body: formData
      }
    );


    const text = await response.text();

    let data;

    try {

      data = JSON.parse(text);

    } catch (jsonError) {

      console.error(
        "Resposta do servidor:",
        text
      );

      throw new Error(
        "O servidor não respondeu em JSON."
      );
    }


    if (!response.ok) {

      throw new Error(
        data.message ||
        "Erro ao processar vídeo."
      );

    }


    if (!data.videoUrl) {

      throw new Error(
        "O servidor não enviou o vídeo."
      );

    }


    resultVideo.src =
      data.videoUrl;

    downloadButton.href =
      data.videoUrl;

    result.style.display =
      "block";

    status.textContent =
      "✅ Vídeo processado com sucesso!";


  } catch (error) {

    console.error(error);

    status.textContent =
      "❌ " + error.message;

  } finally {

    processButton.disabled =
      false;

  }

});

</script>
